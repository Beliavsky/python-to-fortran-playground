name: Test and deploy playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # A queued older push must not revert a completed pin update.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python xvendor.py
      - run: npm ci
      - run: python xeditor.py
      - run: sudo apt-get install -y gfortran
      - run: python -m pip install numpy
      - run: python -m pip install -r requirements-execution.txt
      - run: python -m unittest discover -s tests -p test_public_api.py
      - run: python -m unittest discover -s tests -p test_execution.py
      - run: python -m unittest discover -s tests -p test_fortran_edit.py
      - run: python -m unittest discover -s tests -p test_compiler_options.py
      - run: npm test
      - run: python -m unittest discover -s tests -p test_site_build.py
      - run: python -m unittest discover -s tests -p test_update_upstream.py
      - run: python -m unittest discover -s tests -p test_deploy_service.py
      - run: python -m unittest discover -s tests -p test_probe_lfortran.py
      - run: python xsite.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
